name: Run Unit Tests on Pull Request

on:
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      
      - name: Build Project
        uses: threeal/cmake-action@v2.1.0

      - name: Test
        uses: threeal/ctest-action@v1.1.0
        with:
          build-config: Debug